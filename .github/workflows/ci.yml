name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      PHYSICS_ATLAS_DATABASE_URL: postgresql+psycopg://physics_atlas_ci:ci-only-placeholder@127.0.0.1:5432/physics_atlas_ci
      PHYSICS_ATLAS_ENVIRONMENT: test
      PHYSICS_ATLAS_FIXTURE_MODE: "true"
      PHYSICS_ATLAS_FIXTURE_DIRECTORY: ${{ github.workspace }}/backend/fixtures
      PHYSICS_ATLAS_REFERENCE_DATA_PATH: ${{ github.workspace }}/src/data/demo/atlas.json
      PHYSICS_ATLAS_CROSSREF_MAILTO: ci@example.invalid
      PHYSICS_ATLAS_ORCID_CLIENT_ID: ci-only-placeholder
      PHYSICS_ATLAS_ORCID_CLIENT_SECRET: ci-only-placeholder
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: physics_atlas_ci
          POSTGRES_USER: physics_atlas_ci
          POSTGRES_PASSWORD: ci-only-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U physics_atlas_ci -d physics_atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Ruff format and lint
        run: |
          python -m ruff format --check src tests alembic
          python -m ruff check src tests alembic

      - name: Mypy
        run: python -m mypy src

      - name: Pytest deterministic API, fixture, update, and resource paths
        run: python -m pytest

      - name: Apply Alembic migrations to PostgreSQL
        run: python -m alembic upgrade head

      - name: Verify migration metadata matches the models
        run: python -m alembic check

      - name: Bootstrap non-observational reference data
        run: >-
          python -c "from physics_atlas_api.database import SessionLocal;
          from physics_atlas_api.seed import ensure_reference_data;
          session = SessionLocal(); ensure_reference_data(session); session.close()"

      - name: Exercise deterministic PostgreSQL ingestion and update state
        run: physics-atlas-worker --once --source all

      - name: Exercise PostgreSQL-backed API health and update status
        run: |
          python -m uvicorn physics_atlas_api.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "${api_pid}"' EXIT
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8000/api/health \
            | python -c 'import json, sys; health = json.load(sys.stdin); assert health["status"] == health["database"] == "ok"'
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/api/updates/status \
            | python -c 'import json, sys; status = json.load(sys.stdin); assert status["lastSuccessfulUpdate"] is not None; assert len(status["sources"]) == 3'

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build backend containers
        run: docker compose build

      - name: Start PostgreSQL, migrate, and API
        run: docker compose up --detach db migrate api

      - name: Verify containerized API and deterministic worker
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/api/health \
            | python -c 'import json, sys; health = json.load(sys.stdin); assert health["status"] == health["database"] == "ok"'
          docker compose run --rm worker physics-atlas-worker --once --source all
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/api/updates/status \
            | python -c 'import json, sys; status = json.load(sys.stdin); assert status["lastSuccessfulUpdate"] is not None; assert len(status["sources"]) == 3'

      - name: Show service state on failure
        if: failure()
        run: docker compose ps --all && docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
