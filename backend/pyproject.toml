[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "physics-atlas-api"
version = "3.0.5a0"
description = "Bounded FastAPI and PostgreSQL infrastructure for Physics Atlas"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "alembic>=1.14,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pycountry>=24.6,<25",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-defusedxml>=0.7,<1",
]

[project.scripts]
physics-atlas-api = "physics_atlas_api.main:run"
physics-atlas-backfill = "physics_atlas_api.backfill:run"
physics-atlas-paired-enrichment = "physics_atlas_api.paired_enrichment:run"
physics-atlas-paired-certification = "physics_atlas_api.paired_trial_certification:run"
physics-atlas-replay-certification = "physics_atlas_api.replay_certification:run"
physics-atlas-historical-ror = "physics_atlas_api.historical_ror:run"
physics-atlas-worker = "physics_atlas_api.worker:run"
physics-atlas-seed = "physics_atlas_api.seed:run"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_atlas_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["physics_atlas_api"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
