name: physics-atlas-production

x-backend-environment: &backend-environment
  PHYSICS_ATLAS_DATABASE_URL: ${PHYSICS_ATLAS_DATABASE_URL:?set PHYSICS_ATLAS_DATABASE_URL in .env.production}
  PHYSICS_ATLAS_ENVIRONMENT: production
  # Browser origins never include a path. This is the exact origin of the
  # public GitHub Pages application.
  PHYSICS_ATLAS_CORS_ORIGINS: https://tech-echo-collective.github.io
  PHYSICS_ATLAS_LOG_LEVEL: ${PHYSICS_ATLAS_LOG_LEVEL:-INFO}
  PHYSICS_ATLAS_FIXTURE_MODE: "false"
  PHYSICS_ATLAS_REFERENCE_DATA_PATH: /app/reference/atlas.json
  # The backend rejects unknown scope IDs. This is intentionally fixed to the
  # sole reviewed production acquisition policy for this activation.
  PHYSICS_ATLAS_ACQUISITION_SCOPE: hep-th-v1
  PHYSICS_ATLAS_ROR_RECORD_IDS: ${PHYSICS_ATLAS_ROR_RECORD_IDS:-}
  PHYSICS_ATLAS_RESOURCE_CHECK_ALLOWED_HOSTS: ${PHYSICS_ATLAS_RESOURCE_CHECK_ALLOWED_HOSTS:-ror.org,orcid.org,arxiv.org,inspirehep.net,doi.org,crossref.org}
  PHYSICS_ATLAS_CROSSREF_MAILTO: ${PHYSICS_ATLAS_CROSSREF_MAILTO:-}
  PHYSICS_ATLAS_ORCID_CLIENT_ID: ${PHYSICS_ATLAS_ORCID_CLIENT_ID:-}
  PHYSICS_ATLAS_ORCID_CLIENT_SECRET: ${PHYSICS_ATLAS_ORCID_CLIENT_SECRET:-}
  PHYSICS_ATLAS_ORCID_ACCESS_TOKEN: ${PHYSICS_ATLAS_ORCID_ACCESS_TOKEN:-}

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: *backend-environment
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  networks:
    - data

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - data

  migrate:
    <<: *backend-service
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - data
      - edge

  # `hep-th-v1` bounds INSPIRE and arXiv acquisition. ROR is skipped unless the
  # operator supplies IDs already connected to the bounded corpus.
  worker:
    <<: *backend-service
    command: ["physics-atlas-worker", "--check-resources"]
    environment:
      <<: *backend-environment
      PHYSICS_ATLAS_WORKER_POLL_SECONDS: ${PHYSICS_ATLAS_WORKER_POLL_SECONDS:-3600}
      PHYSICS_ATLAS_RESOURCE_CHECK_MAX_PER_RUN: ${PHYSICS_ATLAS_RESOURCE_CHECK_MAX_PER_RUN:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from sqlalchemy import text; from physics_atlas_api.database import engine; connection = engine.connect(); connection.execute(text('SELECT 1')); connection.close()",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      PHYSICS_ATLAS_API_DOMAIN: ${PHYSICS_ATLAS_API_DOMAIN:?set PHYSICS_ATLAS_API_DOMAIN in .env.production}
      PHYSICS_ATLAS_ACME_EMAIL: ${PHYSICS_ATLAS_ACME_EMAIL:?set PHYSICS_ATLAS_ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - edge

networks:
  data:
  edge:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
