services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-physics_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-physics_atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physics_atlas-local}
    volumes:
      - physics-atlas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment: &backend-environment
      PHYSICS_ATLAS_DATABASE_URL: ${PHYSICS_ATLAS_DATABASE_URL:-postgresql+psycopg://physics_atlas:physics_atlas-local@db:5432/physics_atlas}
      PHYSICS_ATLAS_ENVIRONMENT: ${PHYSICS_ATLAS_ENVIRONMENT:-development}
      PHYSICS_ATLAS_CORS_ORIGINS: ${PHYSICS_ATLAS_CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      PHYSICS_ATLAS_LOG_LEVEL: ${PHYSICS_ATLAS_LOG_LEVEL:-INFO}
      PHYSICS_ATLAS_FIXTURE_MODE: ${PHYSICS_ATLAS_FIXTURE_MODE:-true}
      PHYSICS_ATLAS_FIXTURE_DIRECTORY: ${PHYSICS_ATLAS_FIXTURE_DIRECTORY:-/app/fixtures}
      PHYSICS_ATLAS_REFERENCE_DATA_PATH: ${PHYSICS_ATLAS_REFERENCE_DATA_PATH:-/app/reference/atlas.json}
      PHYSICS_ATLAS_RESOURCE_CHECK_ALLOWED_HOSTS: ${PHYSICS_ATLAS_RESOURCE_CHECK_ALLOWED_HOSTS:-ror.org,orcid.org,arxiv.org,inspirehep.net,doi.org,crossref.org}
      PHYSICS_ATLAS_CROSSREF_MAILTO: ${PHYSICS_ATLAS_CROSSREF_MAILTO:-}
      PHYSICS_ATLAS_ORCID_CLIENT_ID: ${PHYSICS_ATLAS_ORCID_CLIENT_ID:-}
      PHYSICS_ATLAS_ORCID_CLIENT_SECRET: ${PHYSICS_ATLAS_ORCID_CLIENT_SECRET:-}
      PHYSICS_ATLAS_ORCID_ACCESS_TOKEN: ${PHYSICS_ATLAS_ORCID_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["physics-atlas-worker", "--check-resources"]
    environment:
      <<: *backend-environment
      PHYSICS_ATLAS_WORKER_POLL_SECONDS: ${PHYSICS_ATLAS_WORKER_POLL_SECONDS:-3600}
      PHYSICS_ATLAS_RESOURCE_CHECK_MAX_PER_RUN: ${PHYSICS_ATLAS_RESOURCE_CHECK_MAX_PER_RUN:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  physics-atlas-postgres:
